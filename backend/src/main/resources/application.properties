# ========================================================
# Medicine Availability Finder - Master Application Config
# Default active profile: h2 (Embedded for zero-config preview)
# Switch to postgres via: --spring.profiles.active=postgres
# or environment variable: SPRING_PROFILES_ACTIVE=postgres
# ========================================================

spring.application.name=medicine-availability-finder
spring.profiles.active=h2

# Server Configuration
server.port=8080

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.medicinefinder=DEBUG
logging.level.org.hibernate.SQL=WARN
