# ========================================================
# PostgreSQL Production / Local PostgreSQL Profile
# Override variables via Environment or .env:
# DB_HOST (default: localhost)
# DB_PORT (default: 5432)
# DB_NAME (default: medicine_finder_db)
# DB_USER (default: postgres)
# DB_PASSWORD (from environment only - never commit passwords)
# ========================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medicine_finder_db}?currentSchema=public&reWriteBatchedInserts=true
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
